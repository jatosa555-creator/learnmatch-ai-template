<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">LearnMatch AI levels and creation modes</title>
  <desc id="desc">Four levels from a Starter Game Pack to a Developer Template, plus Quick Mode and Deep Mode.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#eef8f5"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".13"/></filter></defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="800" y="84" text-anchor="middle" fill="#09263a" font-family="Arial,sans-serif" font-size="52" font-weight="900">LearnMatch AI — Choose Your Level</text>
  <text x="800" y="126" text-anchor="middle" fill="#4a6575" font-family="Arial,sans-serif" font-size="22">Start with a quick classroom draft, then scale when the content is ready.</text>
  <g filter="url(#shadow)">
    <g transform="translate(70 188)"><rect width="340" height="370" rx="28" fill="#fff" stroke="#8ad5ce" stroke-width="5"/><circle cx="58" cy="64" r="34" fill="#0e9f9a"/><text x="58" y="76" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="900">1</text><text x="112" y="72" fill="#0e716d" font-family="Arial,sans-serif" font-size="29" font-weight="900">STARTER</text><text x="32" y="142" fill="#09263a" font-family="Arial,sans-serif" font-size="28" font-weight="800">Starter Game Pack</text><text x="32" y="198" fill="#4a6575" font-family="Arial,sans-serif" font-size="23">Quick draft</text><text x="32" y="244" fill="#4a6575" font-family="Arial,sans-serif" font-size="23">HTML or ZIP</text><rect x="32" y="284" width="276" height="48" rx="24" fill="#dff6f1"/><text x="170" y="316" text-anchor="middle" fill="#087c78" font-family="Arial,sans-serif" font-size="19" font-weight="800">Try the idea quickly</text></g>
    <g transform="translate(440 188)"><rect width="340" height="370" rx="28" fill="#fff" stroke="#9bc8f3" stroke-width="5"/><circle cx="58" cy="64" r="34" fill="#2563eb"/><text x="58" y="76" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="900">2</text><text x="112" y="72" fill="#245ab8" font-family="Arial,sans-serif" font-size="29" font-weight="900">CLASSROOM</text><text x="32" y="142" fill="#09263a" font-family="Arial,sans-serif" font-size="28" font-weight="800">Classroom Game Pack</text><text x="32" y="198" fill="#4a6575" font-family="Arial,sans-serif" font-size="23">Teacher reviewed</text><text x="32" y="244" fill="#4a6575" font-family="Arial,sans-serif" font-size="23">Ready for class</text><rect x="32" y="284" width="276" height="48" rx="24" fill="#e4efff"/><text x="170" y="316" text-anchor="middle" fill="#245ab8" font-family="Arial,sans-serif" font-size="19" font-weight="800">Check facts and sources</text></g>
    <g transform="translate(810 188)"><rect width="340" height="370" rx="28" fill="#fff" stroke="#c7a3f4" stroke-width="5"/><circle cx="58" cy="64" r="34" fill="#7c3aed"/><text x="58" y="76" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="900">3</text><text x="112" y="72" fill="#6731c4" font-family="Arial,sans-serif" font-size="29" font-weight="900">PUBLISHED</text><text x="32" y="142" fill="#09263a" font-family="Arial,sans-serif" font-size="28" font-weight="800">Published Learning Site</text><text x="32" y="198" fill="#4a6575" font-family="Arial,sans-serif" font-size="23">Public URL</text><text x="32" y="244" fill="#4a6575" font-family="Arial,sans-serif" font-size="23">Share with students</text><rect x="32" y="284" width="276" height="48" rx="24" fill="#f0e8ff"/><text x="170" y="316" text-anchor="middle" fill="#6731c4" font-family="Arial,sans-serif" font-size="19" font-weight="800">Publish reviewed content</text></g>
    <g transform="translate(1180 188)"><rect width="340" height="370" rx="28" fill="#fff" stroke="#f4c85e" stroke-width="5"/><circle cx="58" cy="64" r="34" fill="#d99400"/><text x="58" y="76" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="900">4</text><text x="112" y="72" fill="#a86e00" font-family="Arial,sans-serif" font-size="29" font-weight="900">DEVELOPER</text><text x="32" y="142" fill="#09263a" font-family="Arial,sans-serif" font-size="28" font-weight="800">Developer Template</text><text x="32" y="198" fill="#4a6575" font-family="Arial,sans-serif" font-size="23">GitHub project</text><text x="32" y="244" fill="#4a6575" font-family="Arial,sans-serif" font-size="23">Change any subject</text><rect x="32" y="284" width="276" height="48" rx="24" fill="#fff3cc"/><text x="170" y="316" text-anchor="middle" fill="#a86e00" font-family="Arial,sans-serif" font-size="19" font-weight="800">Reuse and scale</text></g>
  </g>
  <rect x="70" y="626" width="702" height="230" rx="28" fill="#082b40"/><text x="112" y="682" fill="#8ff1e6" font-family="Arial,sans-serif" font-size="30" font-weight="900">Quick Mode</text><text x="112" y="732" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="800">Fast draft from teacher-provided content</text><text x="112" y="780" fill="#bed9e5" font-family="Arial,sans-serif" font-size="21">Best for trying a new topic quickly.</text><text x="112" y="820" fill="#bed9e5" font-family="Arial,sans-serif" font-size="21">Teacher reviews before sharing.</text>
  <rect x="828" y="626" width="702" height="230" rx="28" fill="#fff" stroke="#b7d7e0" stroke-width="3"/><text x="870" y="682" fill="#2563eb" font-family="Arial,sans-serif" font-size="30" font-weight="900">Deep Mode</text><text x="870" y="732" fill="#09263a" font-family="Arial,sans-serif" font-size="25" font-weight="800">Research, cross-check, and approve</text><text x="870" y="780" fill="#4a6575" font-family="Arial,sans-serif" font-size="21">Best for a polished classroom or public release.</text><text x="870" y="820" fill="#4a6575" font-family="Arial,sans-serif" font-size="21">Confirm facts, sources, translations, and image rights.</text>
  <text x="800" y="925" text-anchor="middle" fill="#4a6575" font-family="Arial,sans-serif" font-size="22" font-weight="700">Start small • review facts and image rights • scale when ready</text>
</svg>
