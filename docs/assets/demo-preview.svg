<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">LearnMatch AI web app preview</title>
  <desc id="desc">A mockup of the LearnMatch AI memory game with Remember and Learn tabs, Basic and Advanced difficulty buttons, a 100 point score, and a 3 by 4 card board.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071b2b"/><stop offset="1" stop-color="#102e45"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#14354c"/><stop offset="1" stop-color="#0d263a"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#25d6d1"/><stop offset="1" stop-color="#1967d2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect x="58" y="42" width="1484" height="896" rx="36" fill="#f7fbff" filter="url(#shadow)"/>
