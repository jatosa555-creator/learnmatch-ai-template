  <text x="178" y="104" fill="#082338" font-family="Arial,sans-serif" font-size="42" font-weight="800">LearnMatch AI</text>
  <text x="180" y="140" fill="#466276" font-family="Arial,sans-serif" font-size="20">Learn through play • Remember people • Explore their stories</text>
  <rect x="1140" y="78" width="150" height="58" rx="29" fill="#fff" stroke="#b6d7df" stroke-width="2"/>
  <text x="1215" y="115" text-anchor="middle" fill="#0c5568" font-family="Arial,sans-serif" font-size="22" font-weight="700">ไทย / EN</text>
  <rect x="1310" y="78" width="174" height="58" rx="29" fill="#0e9f9a"/>
  <text x="1397" y="115" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Score 78</text>

  <rect x="98" y="208" width="1404" height="104" rx="22" fill="#f0f7fa"/>
  <rect x="120" y="230" width="220" height="60" rx="16" fill="#0e9f9a"/>
