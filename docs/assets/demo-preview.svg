  <text x="1160" y="400" fill="#082338" font-family="Arial,sans-serif" font-size="27" font-weight="800">Learning progress</text>
  <text x="1160" y="442" fill="#466276" font-family="Arial,sans-serif" font-size="20">Current score</text>
  <text x="1160" y="500" fill="#0e9f9a" font-family="Arial,sans-serif" font-size="58" font-weight="900">78 / 100</text>
  <rect x="1160" y="528" width="260" height="14" rx="7" fill="#d3e2e8"/><rect x="1160" y="528" width="203" height="14" rx="7" fill="#0e9f9a"/>
  <text x="1160" y="600" fill="#466276" font-family="Arial,sans-serif" font-size="20">Completion</text><text x="1418" y="600" text-anchor="end" fill="#082338" font-family="Arial,sans-serif" font-size="20" font-weight="800">30</text>
  <text x="1160" y="646" fill="#466276" font-family="Arial,sans-serif" font-size="20">Accuracy</text><text x="1418" y="646" text-anchor="end" fill="#082338" font-family="Arial,sans-serif" font-size="20" font-weight="800">38 / 50</text>
  <text x="1160" y="692" fill="#466276" font-family="Arial,sans-serif" font-size="20">Speed</text><text x="1418" y="692" text-anchor="end" fill="#082338" font-family="Arial,sans-serif" font-size="20" font-weight="800">10 / 20</text>
  <line x1="1160" y1="730" x2="1418" y2="730" stroke="#c7dce4" stroke-width="2"/>
  <text x="1160" y="780" fill="#0e9f9a" font-family="Arial,sans-serif" font-size="20" font-weight="800">Learn more in the Learn tab →</text>
