    <g transform="translate(806 472)"><rect width="190" height="162" rx="18" fill="url(#card)"/><circle cx="95" cy="70" r="34" fill="#fff" fill-opacity=".42"/><path d="M42 137c10-40 37-57 53-57s43 17 53 57" fill="#fff" fill-opacity=".35"/><text x="95" y="150" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">HEDY LAMARR</text></g>
    <g transform="translate(140 660)"><rect width="190" height="162" rx="18" fill="#fff"/><text x="95" y="92" text-anchor="middle" fill="#2b6477" font-family="Arial,sans-serif" font-size="52" font-weight="800">?</text></g>
    <g transform="translate(362 660)"><rect width="190" height="162" rx="18" fill="url(#card)"/><circle cx="95" cy="70" r="34" fill="#fff" fill-opacity=".42"/><path d="M42 137c10-40 37-57 53-57s43 17 53 57" fill="#fff" fill-opacity=".35"/><text x="95" y="150" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">MARIE CURIE</text></g>
    <g transform="translate(584 660)"><rect width="190" height="162" rx="18" fill="#fff"/><text x="95" y="92" text-anchor="middle" fill="#2b6477" font-family="Arial,sans-serif" font-size="52" font-weight="800">?</text></g>
    <g transform="translate(806 660)"><rect width="190" height="162" rx="18" fill="#fff"/><text x="95" y="92" text-anchor="middle" fill="#2b6477" font-family="Arial,sans-serif" font-size="52" font-weight="800">?</text></g>
  </g>

