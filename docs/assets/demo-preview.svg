  <rect x="350" y="230" width="182" height="60" rx="16" fill="#fff" stroke="#c7dce4" stroke-width="2"/>
  <text x="441" y="268" text-anchor="middle" fill="#34566c" font-family="Arial,sans-serif" font-size="26" font-weight="700">Learn</text>
  <text x="590" y="254" fill="#466276" font-family="Arial,sans-serif" font-size="20">Choose a board</text>
  <rect x="590" y="264" width="250" height="34" rx="17" fill="#d3f3ef"/>
  <text x="715" y="288" text-anchor="middle" fill="#087c78" font-family="Arial,sans-serif" font-size="18" font-weight="700">Basic · 6 people · 3×4</text>
  <rect x="855" y="264" width="310" height="34" rx="17" fill="#fff" stroke="#bed2db" stroke-width="2"/>
  <text x="1010" y="288" text-anchor="middle" fill="#34566c" font-family="Arial,sans-serif" font-size="18" font-weight="700">Advanced · 10 people · 4×5</text>
  <rect x="1200" y="230" width="260" height="60" rx="16" fill="#ffc857"/>
  <text x="1330" y="268" text-anchor="middle" fill="#342200" font-family="Arial,sans-serif" font-size="26" font-weight="800">Start game</text>

  <rect x="98" y="346" width="986" height="526" rx="26" fill="url(#panel)"/>
  <text x="140" y="400" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="800">Match the role models</text>
  <text x="140" y="434" fill="#b5d4e2" font-family="Arial,sans-serif" font-size="19">Find two cards with the same person. Tap a card to begin.</text>
